<title>시간 점프 수직선</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 배치: 왼쪽 시계 / 오른쪽 문항·수직선·버튼. 좁은 폭과 세로에서는 위아래로 쌓고 시계는 위에 붙여 둔다. */
:root {
  --bg: #EDF2F4; --surface: #FFFFFF; --surface-2: #F4F8F9; --ink: #13262E; --ink-2: #455A63; --line: #BFCED4;
  --accent: #0B6A88; --accent-ink: #FFFFFF; --accent-soft: #D6EDF4;
  --jump: #A9490A; --jump-soft: #FCE9D6;
  --good: #1B6B3F; --good-soft: #DCF2E4;
  --warn: #7C5200; --warn-soft: #FFF0C7;
  --bad: #A3231D; --bad-soft: #FBE2E0;
  --face: #FFFFFF; --hand-h: #13262E; --hand-m: #0B6A88; --hand-s: #C0392B; --tick: #455A63;
  --focus: #6B2FE0;
  --shadow: 0 1px 2px rgba(19,38,46,.08), 0 6px 18px rgba(19,38,46,.07);
  --font: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1A20; --surface: #15262E; --surface-2: #1B303A; --ink: #E9F2F5; --ink-2: #A8BDC6; --line: #35525D;
    --accent: #5CC4E2; --accent-ink: #05212A; --accent-soft: #174350;
    --jump: #FFB26E; --jump-soft: #3B2A19;
    --good: #72D69F; --good-soft: #173A29;
    --warn: #F4C65B; --warn-soft: #3A3010;
    --bad: #FF9A91; --bad-soft: #432221;
    --face: #1B303A; --hand-h: #E9F2F5; --hand-m: #5CC4E2; --hand-s: #FF9A91; --tick: #A8BDC6;
    --focus: #C7B0FF; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1A20; --surface: #15262E; --surface-2: #1B303A; --ink: #E9F2F5; --ink-2: #A8BDC6; --line: #35525D;
  --accent: #5CC4E2; --accent-ink: #05212A; --accent-soft: #174350;
  --jump: #FFB26E; --jump-soft: #3B2A19;
  --good: #72D69F; --good-soft: #173A29;
  --warn: #F4C65B; --warn-soft: #3A3010;
  --bad: #FF9A91; --bad-soft: #432221;
  --face: #1B303A; --hand-h: #E9F2F5; --hand-m: #5CC4E2; --hand-s: #FF9A91; --tick: #A8BDC6;
  --focus: #C7B0FF; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 20px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 14px;
}
.wrap { max-width: 1200px; margin: 0 auto; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 34px; line-height: 1.25; text-wrap: balance; }
h2 { font-size: 24px; line-height: 1.3; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

/* 머리말 */
.top { display: flex; align-items: center; gap: 12px; min-height: 56px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; }
.brand svg { flex: none; }
.ctx { flex: 1 1 auto; min-width: 0; font-size: 18px; color: var(--ink-2); font-weight: 700; }
.top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.gear { position: relative; width: 56px; height: 56px; display: grid; place-items: center; border: 0; background: transparent; color: var(--ink-2); border-radius: 50%; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.gear svg { width: 26px; height: 26px; }
.gear .ring { position: absolute; inset: 4px; pointer-events: none; }
.gear .ring circle { fill: none; stroke: var(--accent); stroke-width: 4; stroke-dasharray: 126; stroke-dashoffset: 126; stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; }
.gear.pressing .ring circle { animation: ringfill 3s linear forwards; }
@keyframes ringfill { to { stroke-dashoffset: 0; } }
.gear-tip { position: absolute; top: 60px; right: 0; z-index: 30; background: var(--ink); color: var(--bg); padding: 8px 12px; border-radius: 10px; font-size: 18px; white-space: nowrap; font-weight: 700; }
.top-actions { position: relative; }

/* 버튼 */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; min-height: 64px; padding: 8px 22px; font: inherit; font-size: 20px; font-weight: 800; line-height: 1.25; color: var(--ink); background: var(--surface); border: 2px solid var(--ink-2); border-radius: 14px; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.sm { min-height: 56px; padding: 6px 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.big { min-height: 76px; font-size: 24px; padding: 8px 28px; }
.btn.ghost { border-color: var(--line); }
.btn.warnb { border-color: var(--warn); background: var(--warn-soft); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--surface); }
.btn[aria-disabled="true"], .btn:disabled { opacity: .45; cursor: not-allowed; }
.btn .sub { display: block; font-size: 20px; font-weight: 600; }
.btn[aria-pressed="true"] { background: var(--good-soft); border-color: var(--good); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.row.end { justify-content: flex-end; }
.grow { flex: 1 1 auto; }

/* 카드와 공통 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
.stack { display: grid; gap: 14px; }
.lead { font-size: 24px; color: var(--ink-2); }
.privacy { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-weight: 700; }
.privacy svg { flex: none; margin-top: 2px; }
.err { color: var(--bad); font-weight: 700; min-height: 1.5em; }
.muted { color: var(--ink-2); }
.small { font-size: 18px; }

/* 시작 화면 */
.home { display: grid; gap: 16px; }
fieldset.card { margin: 0; }
legend { font-weight: 800; font-size: 22px; padding: 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.chip span { display: inline-flex; align-items: center; gap: 8px; min-height: 56px; padding: 6px 20px; border: 2px solid var(--ink-2); border-radius: 14px; font-weight: 800; background: var(--surface); }
.chip input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip input:checked + span::before { content: "✓"; font-weight: 900; }
.chip input:focus-visible + span { outline: 4px solid var(--focus); outline-offset: 2px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.mode { display: grid; gap: 14px; align-content: start; }
.mode p { color: var(--ink-2); }

/* 단계 표시줄 */
.steps { list-style: none; margin: 0 0 14px; padding: 0; display: flex; gap: 8px; }
.steps li { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 12px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink-2); font-weight: 800; font-size: 18px; }
.steps .no { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 2px solid currentColor; font-size: 17px; }
.steps li[aria-current="step"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.steps li[aria-current="step"] .no { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.steps li.done .no { background: var(--ink-2); border-color: var(--ink-2); color: var(--surface); }
.steps .short { display: none; }

/* 활동 화면 */
.task-grid { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 18px; align-items: start; }
.clock-card { position: sticky; top: 8px; display: grid; justify-items: center; gap: 6px; padding: 14px; z-index: 5; }
#clock { width: 100%; max-width: 350px; height: auto; display: block; }
.clock-cap { font-weight: 800; color: var(--ink-2); font-size: 18px; }
.main { display: grid; gap: 14px; min-width: 0; }
.q-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 18px; font-weight: 800; color: var(--ink-2); margin-bottom: 6px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 12px; border-radius: 999px; border: 2px solid var(--accent); color: var(--ink); background: var(--accent-soft); font-size: 18px; font-weight: 800; }
.q-body { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-start; }
.q-text { flex: 1 1 320px; min-width: 0; }
#btnSpeak { white-space: nowrap; }
.story { font-size: 22px; line-height: 1.55; }
.ask { font-size: 24px; font-weight: 800; margin-top: 4px; line-height: 1.4; }
.line-wrap { overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }
#line { display: block; max-width: none; }
.line-foot { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; margin-top: 4px; }
.record { flex: 1 1 380px; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 22px; font-weight: 800; padding: 8px 10px; border-radius: 12px; border: 2px solid transparent; }
.record.emph { border-color: var(--accent); background: var(--accent-soft); }
.rt { padding: 2px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.rt.j { background: var(--jump-soft); border-color: var(--jump); }
.rt.q { border-style: dashed; border-width: 2px; color: var(--accent); }
.ra { color: var(--ink-2); }
.line-tools { display: flex; flex-wrap: wrap; gap: 10px; }
.btn .gl { font-size: 26px; line-height: 1; }
.hint { font-size: 22px; font-weight: 700; }
.msg { min-height: 1.5em; font-weight: 700; color: var(--warn); }
.markrow { display: grid; gap: 10px; }
.markrow .row .btn { flex: 1 1 220px; flex-direction: column; gap: 0; }
.dirrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.dirrow .lab { font-weight: 800; }
.dirrow .btn { flex: 1 1 150px; }
.jumps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.jbtn { min-height: 72px; font-size: 24px; flex-direction: column; background: var(--jump-soft); border-color: var(--jump); line-height: 1.2; }
.jbtn:hover { background: var(--jump-soft); filter: brightness(.97); }
.jbtn .lb { font-size: 22px; font-weight: 800; }

/* 답 입력 */
.ans-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
.fields { display: flex; flex-wrap: wrap; gap: 14px 22px; margin-bottom: 14px; }
.field label { display: block; font-size: 24px; font-weight: 800; margin-bottom: 4px; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper input { width: 104px; height: 76px; font: inherit; font-size: 40px; font-weight: 800; text-align: center; color: var(--ink); background: var(--surface); border: 3px solid var(--ink-2); border-radius: 14px; padding: 0; }
.stepper input:disabled { background: var(--surface-2); }
.stepper .btn { width: 64px; min-width: 64px; min-height: 64px; padding: 0; font-size: 34px; border-radius: 50%; }

/* 되돌려 주는 말 */
.fb { display: grid; gap: 12px; border-radius: 18px; padding: 16px 18px; border: 2px solid var(--line); background: var(--surface); }
.fb:empty { height: 0; padding: 0; border: 0; overflow: hidden; margin-top: -14px; }
.fb-head { display: flex; gap: 12px; align-items: flex-start; }
.fb-head svg { flex: none; width: 40px; height: 40px; }
.fb-title { font-size: 20px; font-weight: 800; }
.fb-text { font-size: 24px; font-weight: 800; line-height: 1.45; }
.fb.ask { background: var(--warn-soft); border-color: var(--warn); }
.fb.good { background: var(--good-soft); border-color: var(--good); }
.fb.help { background: var(--accent-soft); border-color: var(--accent); }
.fb.need { background: var(--surface-2); }
.vis { background: var(--surface); border-radius: 12px; border: 1px solid var(--line); padding: 8px; overflow-x: auto; }
.vis svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.vis text { fill: var(--ink); font-family: var(--font); }
.vis .base { stroke: var(--ink); stroke-width: 3; }
.vis .tk { stroke: var(--ink-2); stroke-width: 2; animation: tickin .01s both; animation-delay: calc(var(--i) * 22ms); }
.vis .tk.m5 { stroke: var(--ink); stroke-width: 3; }
.vis .cellband { fill: var(--accent-soft); }
.vis.emph2 .tk { stroke: var(--accent); stroke-width: 3; }
.vis.emph2 .tk.m5 { stroke-width: 5; }
.vis text.jt { fill: var(--jump); }
.vis polygon.jt { fill: var(--jump); }
.vis .dotv { fill: var(--ink); }
.vis .dotv.first { fill: var(--accent); }
.vis .arrowv { stroke: var(--jump); stroke-width: 4; fill: none; }
@keyframes tickin { from { opacity: 0; } to { opacity: 1; } }

/* 시계 */
.face { fill: var(--face); stroke: var(--ink); stroke-width: 5; }
.emph .face { stroke: var(--accent); stroke-width: 8; }
.tick { stroke: var(--tick); stroke-width: 2; stroke-linecap: round; }
.tick.major { stroke: var(--ink); stroke-width: 4; }
.tick.t12.hl, .emph .tick.t12 { stroke: var(--accent); stroke-width: 9; }
.num text { fill: var(--ink); font-size: 27px; font-weight: 800; text-anchor: middle; font-family: var(--font); paint-order: stroke; stroke: var(--face); stroke-width: 6px; stroke-linejoin: round; }
.numbg { fill: transparent; stroke: transparent; stroke-width: 3; }
.numbg.hot { fill: var(--accent-soft); stroke: var(--accent); }
.hand path, .hand line, .hand circle { paint-order: stroke; stroke-linejoin: round; }
.hand-h path { fill: var(--hand-h); stroke: var(--face); stroke-width: 2.5; }
.hand-m path { fill: var(--hand-m); stroke: var(--face); stroke-width: 2.5; }
.hand-s line { stroke: var(--hand-s); stroke-width: 3; stroke-linecap: round; }
.hand-s circle { fill: var(--face); stroke: var(--hand-s); stroke-width: 3; }
.hand-h.pulse path { animation: hpulse 1.1s ease-out 1; }
@keyframes hpulse { 0% { stroke: var(--accent); stroke-width: 2.5; } 30% { stroke: var(--accent); stroke-width: 12; } 100% { stroke: var(--face); stroke-width: 2.5; } }
.cap { fill: var(--ink); }
.flash { fill: none; stroke: var(--accent); stroke-width: 6; opacity: 0; transform-box: fill-box; transform-origin: center; }
.flash.on { animation: flash .65s ease-out 3; }
.flash.on.still { animation: none; opacity: 1; }
@keyframes flash { 0% { opacity: 1; transform: scale(.5); } 100% { opacity: 0; transform: scale(1.9); } }
.clock-ring { fill: none; stroke: var(--accent); stroke-width: 5; stroke-dasharray: 8 8; opacity: 0; }
.show-ring .clock-ring { opacity: 1; }

/* 수직선 */
#line .base { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
#line .tip { fill: var(--ink); }
#line .dot { fill: var(--ink); stroke: var(--surface); stroke-width: 3; }
#line .dot.plain { fill: var(--ink-2); }
#line .dot.hollow { fill: var(--surface); stroke: var(--ink); stroke-width: 4; }
#line .nowring { fill: none; stroke: var(--accent); stroke-width: 4; }
#line .ringhl { fill: none; stroke: var(--accent); stroke-width: 6; }
#line .leader { stroke: var(--line); stroke-width: 2; stroke-dasharray: 3 3; }
#line .arc { fill: none; stroke: var(--jump); stroke-width: 4; stroke-linecap: round; }
#line .head { fill: var(--jump); }
#line.emph .arc { opacity: .3; }
#line.emph .arc.hl, #line.emph .head.hl, #line.emph .jl.hl { opacity: 1; }
#line .arc.hl { stroke-width: 8; }
#line .arc.play { stroke: var(--accent); stroke-width: 7; }
#line .head.play { fill: var(--accent); }
#line text { font-family: var(--font); }
#line .jl { fill: var(--jump); font-size: 21px; font-weight: 800; text-anchor: middle; paint-order: stroke; stroke: var(--surface); stroke-width: 6px; stroke-linejoin: round; }
#line.emph .jl { opacity: .45; }
#line .tl { fill: var(--ink); font-size: 21px; font-weight: 800; text-anchor: middle; }
#line .ap { fill: var(--ink-2); font-size: 15px; font-weight: 700; text-anchor: middle; }
#line .qbox { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 3; stroke-dasharray: 6 4; }
#line .qm { fill: var(--accent); font-size: 30px; font-weight: 900; text-anchor: middle; }
#line .empty { fill: var(--ink-2); font-size: 20px; font-weight: 700; text-anchor: middle; }
#line .arc.new { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--dur, 700ms) ease-in-out forwards; }
#line .head.new { opacity: 0; animation: show 1ms linear forwards; animation-delay: var(--dur, 700ms); }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes show { to { opacity: 1; } }

/* 교사·연구자 화면 */
.teacher { display: grid; gap: 16px; }
.teacher h2 { margin-bottom: 8px; }
.scroll { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 17px; min-width: 560px; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
.tbl th { background: var(--surface-2); font-weight: 800; }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }
.obs { display: grid; gap: 10px; }
.obs-row { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
.obs-row .meta { font-weight: 800; font-size: 18px; }
.obs-row .jr { font-size: 16px; color: var(--ink-2); }
.obs-row .ctl { display: flex; flex-wrap: wrap; gap: 10px; }
.obs-row input[type="text"], .obs-row select, textarea.csv { font: inherit; font-size: 18px; color: var(--ink); background: var(--surface); border: 2px solid var(--ink-2); border-radius: 10px; padding: 8px 10px; min-height: 56px; }
.obs-row input[type="text"] { flex: 1 1 260px; min-width: 0; }
textarea.csv { width: 100%; min-height: 160px; font-size: 15px; font-family: ui-monospace, Menlo, Consolas, monospace; }
.pass { color: var(--good); font-weight: 800; }
.fail { color: var(--bad); font-weight: 800; }
.note { font-weight: 700; padding: 10px 14px; border-radius: 12px; background: var(--warn-soft); border: 1px solid var(--warn); }
.foot { text-align: center; color: var(--ink-2); font-size: 16px; padding: 18px 0 4px; }

@media (min-width: 900px) { #ctrl.sticky { position: sticky; bottom: 8px; z-index: 6; border-color: var(--accent); } }
/* 좁은 화면, 세로 */
@media (max-width: 899px) {
  .task-grid { grid-template-columns: 1fr; gap: 12px; }
  .clock-card { padding: 8px; top: 4px; }
  #clock { max-width: min(46vw, 220px); }
  .modes { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  body { font-size: 19px; }
  h1 { font-size: 28px; }
  .steps { gap: 6px; }
  .steps li { padding: 6px 8px; gap: 6px; font-size: 17px; }
  .steps .full { display: none; }
  .steps .short { display: inline; }
  .jumps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .story { font-size: 22px; }
  .ask { font-size: 23px; }
  .stepper input { width: 92px; }
}
@media (max-width: 420px) {
  .steps .no { width: 28px; height: 28px; }
  .brand { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  #line .arc.new { stroke-dashoffset: 0; }
  #line .head.new { opacity: 1; }
}
</style>
<div class="wrap" id="app" lang="ko">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="currentColor" stroke-width="3"/><path d="M17 7v10l6 4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      <span>시간 점프 수직선</span>
    </div>
    <div class="ctx" id="ctx"></div>
    <div class="top-actions">

const DAY = 86400, HALF = 43200;

const norm = t => ((t % DAY) + DAY) % DAY;
const add = (t, d) => norm(t + d);
const span = (a, b) => norm(b - a);

function clockParts(t) {
  const n = norm(Math.round(t));
  const h24 = Math.floor(n / 3600);
  return { h24, h12: h24 % 12 === 0 ? 12 : h24 % 12, m: Math.floor((n % 3600) / 60), s: n % 60, ap: h24 < 12 ? '오전' : '오후' };
}
function fmtShort(t, withSec) {
  const p = clockParts(t);
  if (withSec) return `${p.h12}시 ${p.m}분 ${p.s}초`;
  if (p.m === 0 && p.s === 0) return `${p.h12}시`;
  return p.s ? `${p.h12}시 ${p.m}분 ${p.s}초` : `${p.h12}시 ${p.m}분`;
}
const fmtClock = (t, withSec) => `${clockParts(t).ap} ${fmtShort(t, withSec)}`;

  if (s) out.push(`${s}초`);

}

const durFields = d => ({ h: Math.floor(d / 3600), m: Math.floor((d % 3600) / 60), s: d % 60 });
const timeFields = t => { const p = clockParts(t); return { h: p.h12, m: p.m, s: p.s }; };

function questionText(q) {
  const sec = q.unit === 'sec';
  const fill = s => s
    .replace('{start}', q.start != null ? fmtClock(q.start, sec) : '')
    .replace('{end}', q.end != null ? fmtClock(q.end, sec) : '')
    .replace('{dur}', q.dur != null ? fmtDur(q.dur) : '')
    .replace('{part1}', q.parts ? fmtDur(q.parts[0]) : '')
    .replace('{part2}', q.parts ? fmtDur(q.parts[1]) : '');
  return { story: fill(q.story), ask: fill(q.ask) };

/* ---------- 정답과 시작점 ----------
   kind: time(시각을 답함) | dur(걸린 시간을 답함)
   anchor: 수직선 위에서 점프를 시작하는 시각, total: 점프 합(부호 있음, 거꾸로면 음수) */
function solve(q) {
  if (q.type === 'end') return { kind: 'time', sec: add(q.start, q.dur), anchor: q.start, total: q.dur };
  if (q.type === 'start') return { kind: 'time', sec: add(q.end, -q.dur), anchor: q.end, total: -q.dur };
  const d = q.end != null ? span(q.start, q.end) : q.parts.reduce((a, b) => a + b, 0);
  return { kind: 'dur', sec: d, anchor: q.start, total: d };
}

function isCorrect(sol, A) {
  if (A.m >= 60 || A.s >= 60 || A.m < 0 || A.s < 0) return false;
  return sol.kind === 'time'
    ? mod12(A.h) * 3600 + A.m * 60 + A.s === sol.sec % HALF
    : A.h * 3600 + A.m * 60 + A.s === sol.sec;
}
function sameFields(kind, A, f) {
  const hOk = kind === 'time' ? mod12(A.h) === mod12(f.h) : A.h === f.h;
  return hOk && A.m === f.m && A.s === f.s;
}
function overflowType(f, unit) {
  if (unit === 'sec' && f.s >= 60) return 'sec60';
  if (f.m >= 60) return 'carry60';

function noCarrySum(list) {

    while (boxes.some(b => b.l < mx + w / 2 && mx - w / 2 < b.r && Math.abs(b.rel - rel) < 24)) rel += 25;
    boxes.push({ l: mx - w / 2, r: mx + w / 2, rel });
    o.lrel = rel;
  });
  const maxTop = Math.max(40, ...arcs.map(o => o.lrel + 20));
  const lineY = maxTop + 12;

  /* 점 아래 시각 라벨: 겹치면 아래 줄로 내린다 */
  const rows = [];
  const dotRow = new Map();
  [...M.pts.values()].filter(p => p.label != null).sort((x, y) => x.t - y.t).forEach(p => {
    const w = (p.label === '?' ? 58 : Math.max(textW(p.label, 21), 40)) + 12, x = xOf(p.t);
    let r = 0; while ((rows[r] || []).some(b => b.l < x + w / 2 && x - w / 2 < b.r)) r++;
    (rows[r] = rows[r] || []).push({ l: x - w / 2, r: x + w / 2 });
    dotRow.set(p.t, r);
  });
  const H = lineY + 80 + Math.max(0, rows.length - 1) * 54;

  const st = S.fbState, lvl = st ? st.level : 0, emph = lvl >= 2;
  const hlSet = new Set();
  if (emph && st) {
    arcs.forEach(o => {
      if (st.type === 'carry60' || st.type === 'borrow100') { if (crosses(o.from, o.to, 3600) || mod(Math.max(o.from, o.to), 3600) === 0) hlSet.add(o.i); }
      else if (st.type === 'sec60') { if (crosses(o.from, o.to, 60) || mod(Math.max(o.from, o.to), 60) === 0) hlSet.add(o.i); }
      else if (st.type === 'other') hlSet.add(o.i);
    });
  }
  const anyHl = hlSet.size > 0;

  let g = '';
  g += `<line class="base" x1="22" y1="${lineY}" x2="${W - 30}" y2="${lineY}"/><polygon class="tip" points="${W - 14},${lineY} ${W - 32},${lineY - 9} ${W - 32},${lineY + 9}"/>`;
  if (!n) g += `<text class="empty" x="${W / 2}" y="${lineY - 16}">${q.mark === 'student' ? '아래 버튼을 눌러 두 시각을 점으로 찍어요' : '점프를 만들면 여기에 그려져요'}</text>`;

  arcs.forEach(o => {
    const x1 = o.x1, x2 = o.x2, y0 = lineY - 13;
    const mx = (x1 + x2) / 2, cy = y0 - 2 * o.ah;
    let ux = x2 - mx, uy = y0 - cy; const ul = Math.hypot(ux, uy) || 1; ux /= ul; uy /= ul;
    const hs = Math.min(16, (o.hi - o.lo) * 0.45), bx = x2 - ux * hs, by = y0 - uy * hs, nx = -uy * hs * 0.48, ny = ux * hs * 0.48;
    const isNew = S.newArc && o.i === S.jumps.length - 1, play = S.playIdx === o.i, hl = emph && anyHl && hlSet.has(o.i);
    const cls = `${isNew ? ' new' : ''}${play ? ' play' : ''}${hl ? ' hl' : ''}`;
    const style = isNew ? ` style="--dur:${jumpMs(o.j.d)}ms"` : '';
    const ly = lineY - o.lrel, apexY = y0 - o.ah;
    const leader = ly < apexY - 30 ? `<line class="leader" x1="${mx.toFixed(1)}" y1="${(ly + 5).toFixed(1)}" x2="${mx.toFixed(1)}" y2="${(apexY - 3).toFixed(1)}"/>` : '';
    g += `<g${style}><path class="arc${cls}" pathLength="1" d="M${x1.toFixed(1)} ${y0} Q${mx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y0}"/>`
      + `<polygon class="head${cls}" points="${x2.toFixed(1)},${y0 + 2} ${(bx + nx).toFixed(1)},${(by + ny).toFixed(1)} ${(bx - nx).toFixed(1)},${(by - ny).toFixed(1)}"/>`
      + leader + `<text class="jl${hl ? ' hl' : ''}" x="${mx.toFixed(1)}" y="${ly.toFixed(1)}">${esc(o.label)}</text></g>`;
  });

  M.pts.forEach(p => {
    const x = xOf(p.t);
    if (p.now) g += `<circle class="nowring" cx="${x}" cy="${lineY}" r="17"/>`;
    if (emph && st && st.type === 'order' && (p.role === 'anchor' || p.role === 'given')) g += `<circle class="ringhl" cx="${x}" cy="${lineY}" r="23"/>`;
    const labeled = p.label != null, dy = (dotRow.get(p.t) || 0) * 54;
    g += `<circle class="dot${p.hollow ? ' hollow' : labeled ? '' : ' plain'}" cx="${x}" cy="${lineY}" r="${labeled ? 10 : 6}"/>`;
    if (dy) g += `<line class="leader" x1="${x}" y1="${lineY + 14}" x2="${x}" y2="${lineY + dy + 22}"/>`;
    if (p.label === '?') g += `<rect class="qbox" x="${x - 27}" y="${lineY + 24 + dy}" width="54" height="50" rx="10"/><text class="qm" x="${x}" y="${lineY + 59 + dy}">?</text>`;
    else if (labeled) g += `<text class="ap" x="${x}" y="${lineY + 38 + dy}">${clockParts(p.t).ap}</text><text class="tl" x="${x}" y="${lineY + 62 + dy}">${esc(p.label)}</text>`;
  });

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.classList.toggle('emph', emph && anyHl);
  svg.innerHTML = g;
  svg.setAttribute('aria-label', '빈 수직선. ' + recordTokens().map(t => t.txt).join(' ').replace(/→/g, '다음'));
  if (S.newArc) { wrap.scrollLeft = wrap.scrollWidth; S.newArc = false; }
  renderRecord(M);
}

function recordTokens() {
  const q = S.q, M = lineModel(), out = [];

    t0: Date.now(), lastAct: Date.now(), stallFlag: false, ctrlMsg: '' });

  await sleep(reduced() ? 100 : 500);

}

function checkJumps() {
  const q = S.q, sol = S.sol;
  if (q.mark === 'student' && !(S.marks.start && S.marks.end)) return '먼저 수직선에 두 점을 찍어요.';
  if (!S.jumps.length) return '점프를 한 번 이상 만들어 보세요.';
  const sum = S.jumps.reduce((a, j) => a + j.d, 0);
  if (sum === sol.total) return '';
  if (q.type === 'start' && sum > 0) return '시작 시각은 끝난 시각보다 앞이에요. "거꾸로"를 눌러 볼까요?';
  const short = Math.abs(sum) < Math.abs(sol.total) && Math.sign(sum) === Math.sign(sol.total);

      const set = ($('input[name="pset"]:checked') || {}).value || 'all';
      S.pid = ($('input[name="pid"]:checked') || {}).value || null;
      startSession('practice', practiceList(set)); break;
    }
    case 'startEval': {

      if (!p) { $('#homeErr').textContent = '참여자 기호를 먼저 골라 주세요.'; $('#pidBox').scrollIntoView({ block: 'center' }); const f = $('input[name="pid"]'); if (f) f.focus(); break; }
      $('#homeErr').textContent = ''; S.pid = p.value;

    case 'doneJumps': {

    }

      let v = raw === '' ? f.min : parseInt(raw, 10) + d;
      if (f.k === 'h' && kindOfQ() === 'time') v = v > 12 ? 1 : v < 1 ? 12 : v; else v = Math.max(f.min, Math.min(f.max, v));

    }
    case 'check': onCheck(); break;
    case 'help': S.help++; S.fb = { kind: 'help' }; renderFb(); break;
    case 'next': nextQuestion(); break;
    case 'skip': twoStep(b, '넘어가기', '한 번 더 누르면 넘어가요', () => { finishTask('incomplete'); nextQuestion(); }); break;
    case 'tBack': closeTeacher(); break;
    case 'copyCsv': copyCsv(); break;
    case 'selCsv': { const x = $('#csvBox'); x.focus(); x.select(); break; }
    case 'selfcheck': runSelfCheck(); break;
    case 'wipe': twoStep(b, '기록 전체 삭제', '정말 지울까요? 한 번 더 누르면 모두 지워져요', () => { saveRecs([]); renderTeacher(); $('#copyMsg') && ($('#copyMsg').textContent = ''); }); break;
    default: break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('#task .stepper input')) {
    const f = answerFields().find(x => x.k === t.dataset.k);
    let v = t.value.replace(/\D/g, '').slice(0, 3);
    if (v !== '' && +v > f.max) v = String(f.max);
    t.value = v; S.ans[f.k] = v;
  } else if (t.matches('.memo-in')) {
    const id = t.closest('.obs-row').dataset.rid, a = loadRecs(), r = a.find(x => x.id === id);
    if (r) { r.memo = t.value; saveRecs(a); }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('.usab-sel')) { const id = t.closest('.obs-row').dataset.rid, a = loadRecs(), r = a.find(x => x.id === id); if (r) { r.usab = t.value; saveRecs(a); } }
  if (t.matches('input[name="pid"]')) $('#homeErr').textContent = '';
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('#task .stepper input')) { e.preventDefault(); onCheck(); }
});
['pointerdown', 'keydown', 'input'].forEach(ev => document.addEventListener(ev, () => { S.lastAct = Date.now(); S.stallFlag = false; }, true));
let rz = 0;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.view === 'task') renderLine(); }, 120); });

/* 5초 이상 조작이 멈춘 시점을 기록 */
setInterval(() => {
  if (S.view !== 'task' || !S.q || S.solved || S.saved) return;
  if (Clock.busy || S.replaying || S.speaking) { S.lastAct = Date.now(); return; }
  if (!S.stallFlag && Date.now() - S.lastAct >= 5000) {
    S.stallFlag = true;
    S.stalls.push({ t: Math.max(0, Math.round((S.lastAct - S.t0) / 1000)), phase: PHASE[S.step] });
  }
}, 500);

/* ---------- 시작 ---------- */
Clock.init();
buildHome();
showView('home');
window.__TJ = { S, Clock, loadRecs, saveRecs, goStep, onCheck, doJump, Store };
})();
</script>
